<html>
<head>
    <script>
        function sum() {
            let age = parseInt(prompt("Enter your age"));

            if (age >= 18) {
                let c = confirm("Do you want to submit your details?");

                if (c) {
                    alert("Your response has been submitted.");
                } else {
                    alert("Thank you.");
                }
            } else {
                alert("You are not eligible.");
            }
        }
    </script>
</head>

<body>
    <input type="button" value="Result" onclick="sum()">
</body>
</html>
