<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>string Functions</title>
</head>
    <body>
    <script>
        let str = "Hello, World!";
        let length = str.length;
        console.log(length);
        let upperCase = str.toUpperCase();
        console.log(upperCase);
        let lowerCase = str.toLowerCase();
        console.log(lowerCase);
        let indexOf = str.indexOf("l");
        console.log(indexOf);
        let substring = str.substring(0, 5);
        console.log(substring);
        let replace = str.replace("World", "JavaScript");
        console.log(replace);
        let Include = str.includes("Hello");
        console.log(Include);
        let Char = str.charAt(7);
        console.log(Char);
        let Slice = str.slice(3, 9);
        console.log(Slice);

    </script>
</body>
</html>
